# Gradle JVM settings. Same shape as the Flutter 3.47 template, with the heap
# lowered to 4 GB: CI runners are shared and the Kotlin compiler daemon needs
# its own headroom on top of this JVM.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# AGP 9 ships a new DSL and built-in Kotlin support. Flutter's Gradle plugin
# still targets the previous behaviour, so both are pinned off — the same values
# the Flutter 3.47 template writes.
android.newDsl=false
android.builtInKotlin=false
